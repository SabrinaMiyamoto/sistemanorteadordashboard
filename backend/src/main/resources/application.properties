# Mesmo banco usado pelo antigo config.php (XAMPP: root sem senha)
server.port=8080

# characterEncoding=UTF-8 garante acentos e ç corretos entre o Java e o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_norteador?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# As tabelas são criadas pelo database/dump.sql; o Hibernate não altera nada
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Ao iniciar, roda o schema.sql: cria a tabela marcas_personalizadas se ela ainda não existir
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Requisições e respostas sempre em UTF-8 (Content-Type: application/json;charset=UTF-8)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# API gratuita da Tabela FIPE (marcas e modelos de carros), sem cadastro nem chave
app.fipe.url=https://parallelum.com.br/fipe/api/v1

# Endereços do frontend React (Vite) liberados no CORS (separados por vírgula).
# Em desenvolvimento, qualquer porta de localhost/127.0.0.1 é aceita.
app.cors.origin=${APP_CORS_ORIGIN:http://localhost:*,http://127.0.0.1:*}
